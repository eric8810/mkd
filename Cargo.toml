[package]
name = "mkd"
version = "0.1.0"
edition = "2021"
description = "A featherweight macOS-native Markdown reader built on GPUI"

[dependencies]
gpui = "0.2.2"
pulldown-cmark = "0.13"
emojis = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
